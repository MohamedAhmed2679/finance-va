name: App builds (Android, iOS, macOS, Windows)

# Builds installable test apps on every push to main and publishes them to the
# "test-build" pre-release:  https://github.com/MohamedAhmed2679/finance-va/releases/tag/test-build
# The apps load https://zaylo.cc, so they always match the live web app.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'supabase/**']
  workflow_dispatch:

concurrency:
  group: app-builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android APK + Play bundle
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ZAYLO_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Android SDK 36 (runner's preinstalled SDK)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Version number for this build
        run: |
          # Play refuses an upload whose versionCode isn't higher than the last one
          echo "ZAYLO_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ZAYLO_VERSION_NAME=1.6.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Release build (signed with the Zaylo upload key)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          ZAYLO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ZAYLO_UPLOAD_KEYSTORE_BASE64 }}
          ZAYLO_KEYSTORE_PASSWORD: ${{ secrets.ZAYLO_KEYSTORE_PASSWORD }}
          ZAYLO_KEY_ALIAS: ${{ secrets.ZAYLO_KEY_ALIAS }}
          ZAYLO_KEY_PASSWORD: ${{ secrets.ZAYLO_KEY_PASSWORD }}
        run: |
          export ZAYLO_KEYSTORE_PATH="$RUNNER_TEMP/zaylo-upload.jks"
          echo "$ZAYLO_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$ZAYLO_KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
          rm -f "$ZAYLO_KEYSTORE_PATH"
          cp app/build/outputs/apk/release/app-release.apk ../Zaylo-android.apk
          cp app/build/outputs/bundle/release/app-release.aab ../Zaylo-android.aab
      - name: Debug build (no upload key in the repository secrets yet)
        if: env.HAS_UPLOAD_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::ZAYLO_UPLOAD_KEYSTORE_BASE64 is not set, so this is a debug build. Play won't accept it and each build has a different signature."
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Zaylo-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: Zaylo-android.apk, retention-days: 30 }
      - name: Keep the Play bundle (private build artifact, not on the public release)
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: actions/upload-artifact@v4
        with: { name: play-bundle, path: Zaylo-android.aab, retention-days: 90 }

  apple:
    # iPhone and Mac share one macOS machine: GitHub's Mac runners are often scarce,
    # and waiting for two of them at once left the Mac build unbuilt.
    name: iOS IPA (unsigned) + macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync ios
      - name: Build unsigned app for devices
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Zaylo-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: Zaylo-ios-unsigned.ipa, retention-days: 30 }
      - name: Build the Mac app
        env: { ELECTRON: 'true' }
        run: |
          rm -rf dist
          npx vite build
          npx electron-builder --mac --publish never
          cp release/*.dmg Zaylo-mac.dmg
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: Zaylo-mac.dmg, retention-days: 30 }

  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      ELECTRON: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder --win --publish never
      - shell: bash
        run: cp release/*.exe Zaylo-windows-setup.exe
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: Zaylo-windows-setup.exe, retention-days: 30 }

  release:
    name: Publish test-build release
    needs: [android, apple, windows]
    # only main replaces the test-build release; other branches just produce downloadable artifacts
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.android.result == 'success' && needs.apple.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        # android, ios, macos, windows only: the Play bundle (play-bundle) stays a private artifact
        with: { path: out, merge-multiple: true, pattern: '[aimw]*' }
      - name: Replace the test-build pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build out/* --prerelease --target "${{ github.sha }}" \
            --title "Test build — ${GITHUB_SHA::7}" \
            --notes "Installable test apps for commit ${GITHUB_SHA::7}. They load https://zaylo.cc.

          - **Android**: Zaylo-android.apk — open on the phone and allow installs from your browser.
          - **iPhone**: Zaylo-ios-unsigned.ipa — install with Sideloadly (Windows/Mac) or AltStore using your Apple ID; free Apple IDs need a re-install every 7 days.
          - **macOS**: Zaylo-mac.dmg — unsigned; right-click the app → Open the first time.
          - **Windows**: Zaylo-windows-setup.exe — unsigned; More info → Run anyway."
